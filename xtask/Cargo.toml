[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Dev-only tooling (not published). `cargo run -p xtask -- gen-readme [--check]`
# rebuilds the README capability sections from capabilities.json.

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

# The ADR checks (tests/adr_docs.rs, tests/adr_conformance.rs) read docs/adr and assert decisions
# against the real types.
[dev-dependencies]
mobiler-core = { path = "../mobiler-core" }
# ADR-0003 asserts on the facet shape the shells are generated from (same pin as mobiler-core).
facet = "=0.44"
