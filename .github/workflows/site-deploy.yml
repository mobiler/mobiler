# Publishes site/ (mobiler.rs) to GitHub Pages: on every push to main that changes what the site is
# built from, or by hand (Run workflow). One-time setup (Pages source, custom domain, DNS, HTTPS) is in
# site/DEPLOY.md. The custom domain lives in Settings → Pages; an Actions deploy ignores a CNAME file.
name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Everything scripts/sync.mjs reads, plus the site itself.
    paths:
      - site/**
      - docs/tutorial/saldo/**
      - capabilities.json
      - mobiler/plugins/*/mobiler-plugin.toml
      - demos/*/screenshots/**
      - .github/workflows/site-deploy.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main is published, whichever branch the run was started from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes gets the Pages token; build runs npm install scripts.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
