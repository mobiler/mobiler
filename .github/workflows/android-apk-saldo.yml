name: Android APK (saldo)

# On-demand "cloud Android build" for Saldo: click "Run workflow" (or `gh workflow
# run android-apk-saldo.yml`) and download the APK from the run's artifacts — no
# local Android toolchain needed. Builds Saldo's release APK (slim: release Rust +
# stripped, signed with the debug key so it sideloads onto any device).
on:
  workflow_dispatch:

jobs:
  apk:
    name: saldo release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/saldo
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: demos/saldo

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK pinned by the gradle config
        # sdkmanager isn't on PATH on the runner; use its full path. `set +o pipefail`
        # so piping `yes` (to accept licenses) doesn't fail the step via SIGPIPE.
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;30.0.14904198"

      - name: Generate Kotlin ABI types + uniffi bindings
        run: |
          cargo build -p shared --features uniffi
          cargo run -p shared --bin codegen --features codegen,facet_typegen -- \
            --language kotlin --output-dir Android/generated

      - name: Build the release APK (release Rust via -PrustRelease)
        run: ./Android/gradlew -p Android --no-daemon :app:assembleRelease -PrustRelease

      # The shell's release build is unsigned (the template's, ADR-0059: Saldo's shell equals it). Sign
      # it here with a throwaway debug key so the shareable APK sideloads onto any device; a Play upload
      # uses an upload key in its own lane.
      - name: Sign the release APK with a debug key
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
          OUT=Android/app/build/outputs/apk/release
          "$BT/zipalign" -f -p 4 "$OUT/app-release-unsigned.apk" "$OUT/app-release-aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
            --out "$OUT/saldo-release.apk" "$OUT/app-release-aligned.apk"
          "$BT/apksigner" verify "$OUT/saldo-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saldo-apk-${{ github.sha }}
          path: demos/saldo/Android/app/build/outputs/apk/release/saldo-release.apk
          if-no-files-found: error
