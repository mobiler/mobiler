<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fade House — barbershop booking (Mobiler)</title>
  <!-- Trunk builds the Rust crate to WASM and injects it. The shell injects its own
       stylesheet at runtime, so no app CSS lives here. data-wasm-opt=0 skips wasm-opt. -->
  <link data-trunk rel="rust" data-wasm-opt="0" />
<!-- mobiler:fonts-begin -->
<link data-trunk rel="copy-dir" href="fonts"/>
<link rel="stylesheet" href="fonts/mobiler-fonts.css"/>
<!-- mobiler:fonts-end -->
<!-- mobiler:splash-begin -->
<link data-trunk rel="copy-dir" href="splash"/>
<style>
html{background:#FAF7F0}
body:empty{min-height:100vh;margin:0;background:url(splash/mobiler-splash-logo.png) center/120px 120px no-repeat}
@media (prefers-color-scheme: dark){html{background:#231F20}body:empty{background-image:url(splash/mobiler-splash-logo-dark.png)}}
</style>
<!-- mobiler:splash-end -->
</head>

</html>
