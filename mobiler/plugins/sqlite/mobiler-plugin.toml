# Free, bundled Mobiler plugin: on-device SQLite, one database (`mobiler.db`). Call from Rust:
#   cx.plugin("sqlite", "exec",  r#"{"sql":"INSERT INTO t(a) VALUES (?)","args":["x"]}"#, |r| Msg::Saved(r.ok))
#   cx.plugin("sqlite", "query", "SELECT a FROM t", |r| Msg::Rows(r.output))   // JSON array of {column: text}
#
# Calls run one at a time, in the order the core issued them, on one connection (ADR-0065): an exec's
# ok:true means the write is committed, and a query issued after it sees it. On iOS the order needs the
# shell's `Plugins.inOrder` (CLI 0.73.2+): run `mobiler upgrade --apply` along with re-adding this plugin.
#
# Install:  mobiler plugin add sqlite
name = "sqlite"
summary = "On-device SQLite — exec / query → JSON rows (free)"

[android]
sources = ["android/SqlitePlugin.kt"]
register = '"sqlite" to SqlitePlugin(application)'

[ios]
# libsqlite3 via the system SQLite3 module (no extra link). Matches the Android exec/query contract.
sources = ["ios/SqlitePlugin.swift"]
register = 'case "sqlite": return await SqlitePlugin.handle(op: op, input: input)'
